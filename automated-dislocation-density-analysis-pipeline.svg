<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; }
      .t  { font-size: 14px; font-weight: 400; fill: #3d3d3a; }
      .th { font-size: 14px; font-weight: 500; fill: #3d3d3a; }
      .ts { font-size: 12px; font-weight: 400; fill: #73726c; }
      .label-top { font-size: 11px; font-weight: 500; fill: #888780; letter-spacing: 0.08em; }
      @media (prefers-color-scheme: dark) {
        .t  { fill: #c2c0b6; }
        .th { fill: #e8e6df; }
        .ts { fill: #9c9a92; }
        .label-top { fill: #5f5e5a; }
      }
      .step-box { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
      .step-box-2 { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
      .step-box-3 { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
      .step-box-4 { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
      .step-box-5 { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
      .t-blue  { fill: #0C447C; }
      .t-teal  { fill: #085041; }
      .t-amber { fill: #633806; }
      .t-purp  { fill: #3C3489; }
      .t-coral { fill: #712B13; }
      .ts-blue  { fill: #185FA5; }
      .ts-teal  { fill: #0F6E56; }
      .ts-amber { fill: #854F0B; }
      .ts-purp  { fill: #534AB7; }
      .ts-coral { fill: #993C1D; }
      @media (prefers-color-scheme: dark) {
        .step-box   { fill: #0C447C; stroke: #85B7EB; }
        .step-box-2 { fill: #085041; stroke: #5DCAA5; }
        .step-box-3 { fill: #633806; stroke: #EF9F27; }
        .step-box-4 { fill: #3C3489; stroke: #AFA9EC; }
        .step-box-5 { fill: #712B13; stroke: #F0997B; }
        .t-blue  { fill: #B5D4F4; }
        .t-teal  { fill: #9FE1CB; }
        .t-amber { fill: #FAC775; }
        .t-purp  { fill: #CECBF6; }
        .t-coral { fill: #F5C4B3; }
        .ts-blue  { fill: #85B7EB; }
        .ts-teal  { fill: #5DCAA5; }
        .ts-amber { fill: #EF9F27; }
        .ts-purp  { fill: #AFA9EC; }
        .ts-coral { fill: #F0997B; }
      }
      .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
      .step-num { font-size: 11px; font-weight: 500; fill: #888780; }
      @media (prefers-color-scheme: dark) {
        .arr { stroke: #5f5e5a; }
        .step-num { fill: #5f5e5a; }
      }
    </style>
  </defs>

  <!-- Title -->
  <text class="label-top" x="340" y="30" text-anchor="middle">AUTOMATED DISLOCATION DENSITY ANALYSIS — 5-STEP PIPELINE</text>

  <!-- Step 1: TEM Image Acquisition -->
  <text class="step-num" x="100" y="66" text-anchor="middle">01</text>
  <rect class="step-box" x="40" y="72" width="220" height="64" rx="8"/>
  <text class="th t-blue" x="150" y="97" text-anchor="middle" dominant-baseline="central">TEM image acquisition</text>
  <text class="ts ts-blue" x="150" y="117" text-anchor="middle" dominant-baseline="central">Raw cryo-TEM micrographs input</text>

  <!-- Arrow 1→2 -->
  <line x1="260" y1="104" x2="300" y2="104" class="arr" marker-end="url(#arrow)"/>

  <!-- Step 2: Preprocessing & Segmentation -->
  <text class="step-num" x="420" y="66" text-anchor="middle">02</text>
  <rect class="step-box-2" x="300" y="72" width="220" height="64" rx="8"/>
  <text class="th t-teal" x="410" y="97" text-anchor="middle" dominant-baseline="central">Preprocessing &amp; segmentation</text>
  <text class="ts ts-teal" x="410" y="117" text-anchor="middle" dominant-baseline="central">Noise reduction, contrast normalisation</text>

  <!-- Arrow 2→3 (down) -->
  <line x1="410" y1="136" x2="410" y2="196" class="arr" marker-end="url(#arrow)"/>

  <!-- Step 3: Dislocation Line Detection -->
  <text class="step-num" x="420" y="210" text-anchor="middle">03</text>
  <rect class="step-box-3" x="300" y="216" width="220" height="64" rx="8"/>
  <text class="th t-amber" x="410" y="241" text-anchor="middle" dominant-baseline="central">Dislocation line detection</text>
  <text class="ts ts-amber" x="410" y="261" text-anchor="middle" dominant-baseline="central">Computer vision edge &amp; feature extraction</text>

  <!-- Arrow 3→4 (left) -->
  <line x1="300" y1="248" x2="260" y2="248" class="arr" marker-end="url(#arrow)"/>

  <!-- Step 4: Density Quantification -->
  <text class="step-num" x="100" y="210" text-anchor="middle">04</text>
  <rect class="step-box-4" x="40" y="216" width="220" height="64" rx="8"/>
  <text class="th t-purp" x="150" y="241" text-anchor="middle" dominant-baseline="central">Density quantification</text>
  <text class="ts ts-purp" x="150" y="261" text-anchor="middle" dominant-baseline="central">Statistical line-length per unit area</text>

  <!-- Arrow 4→5 (down) -->
  <line x1="150" y1="280" x2="150" y2="340" class="arr" marker-end="url(#arrow)"/>

  <!-- Step 5: Yield Strength Prediction -->
  <text class="step-num" x="100" y="354" text-anchor="middle">05</text>
  <rect class="step-box-5" x="40" y="360" width="220" height="64" rx="8"/>
  <text class="th t-coral" x="150" y="385" text-anchor="middle" dominant-baseline="central">Yield strength prediction</text>
  <text class="ts ts-coral" x="150" y="405" text-anchor="middle" dominant-baseline="central">Taylor model maps density → MPa</text>

  <!-- Legend -->
  <rect x="40" y="460" width="600" height="60" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="ts" x="340" y="482" text-anchor="middle">Pipeline output: dislocation density map + predicted yield strength for metallic specimens</text>
  <text class="ts" x="340" y="502" text-anchor="middle">Hybrid framework combines traditional computer vision with ML-based quantification</text>
</svg>
